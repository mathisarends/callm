[project]
name = "py-llmify"
version = "1.0.0"
description = "Small Pydantic AI based chat models for OpenAI Responses and Codex."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]~=2.50.0",
]

[project.optional-dependencies]
websocket = [
    "openai[realtime]>=3.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmify"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
