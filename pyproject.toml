[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-llmify"
version = "0.12.0"
description = "A minimal, type-safe Python library for LLM chat completions across multiple providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-ai-slim>=2.46.0",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=2.46.0", "websockets>=13.0"]
all = ["pydantic-ai-slim[openai]>=2.46.0", "websockets>=13.0"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["llmify"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    # Optional-dependency guards: unreachable once the extra is installed.
    "except ImportError:",
]

[tool.setuptools.packages.find]
include = ["llmify*"]
exclude = ["tests*", "examples*"]
